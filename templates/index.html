<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activity & Budget Tracker</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="container">
    <h1>Activity & Budget Tracker</h1>

    <section class="grid">
      <div class="card">
        <h2>Add Activity</h2>
        <form id="activityForm">
          <input name="title" placeholder="Activity title" required />
          <input name="category" placeholder="Category (Work, Fitness...)" required />
          <input name="duration_minutes" type="number" min="1" placeholder="Minutes" required />
          <input name="activity_date" type="date" required />
          <textarea name="notes" placeholder="Notes"></textarea>
          <button type="submit">Save Activity</button>
        </form>
      </div>

      <div class="card">
        <h2>Add Budget</h2>
        <form id="budgetForm">
          <input name="name" placeholder="Budget name" required />
          <input name="monthly_limit" type="number" min="1" step="0.01" placeholder="Monthly limit" required />
          <input name="spent" type="number" min="0" step="0.01" placeholder="Spent so far" required />
          <input name="month" type="month" required />
          <button type="submit">Save Budget</button>
        </form>
      </div>
    </section>

    <section class="grid">
      <div class="card">
        <h2>Summary</h2>
        <div id="summary"></div>
      </div>
      <div class="card">
        <h2>Portable Data Location</h2>
        <p id="dbPath"></p>
      </div>
    </section>

    <section class="card">
      <h2>Activities</h2>
      <table id="activityTable">
        <thead><tr><th>Date</th><th>Title</th><th>Category</th><th>Minutes</th><th>Notes</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card">
      <h2>Budgets</h2>
      <table id="budgetTable">
        <thead><tr><th>Month</th><th>Name</th><th>Limit</th><th>Spent</th><th>Remaining</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
